<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-labelledby="title description">
<title id="title">Three routes from vertex 1 to vertex 4</title>
<desc id="description">Directed edges 1 to 2 cost 4, 1 to 3 cost 1, 3 to 2 cost 2, 2 to 4 cost 1, and 3 to 4 cost 5. Red edges highlight the minimum-cost route 1 to 3 to 2 to 4, costing 4.</desc>
<rect width="600" height="330" fill="white"/>
<defs><marker id="gray-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#737373"/></marker><marker id="red-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 Z" fill="#b31b1b"/></marker></defs>
<line x1="97.46" y1="175.98" x2="275.74" y2="263.14" stroke="#737373" stroke-width="2.2" marker-end="url(#gray-arrow)"/>
<text x="173" y="241" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">4</text>
<line x1="322.46" y1="65.98" x2="500.74" y2="153.14" stroke="#737373" stroke-width="2.2" marker-end="url(#gray-arrow)"/>
<text x="425" y="88" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">5</text>
<line x1="97.46" y1="154.02" x2="275.74" y2="66.86" stroke="#b31b1b" stroke-width="3.5" marker-end="url(#red-arrow)"/>
<text x="173" y="88" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">1</text>
<line x1="300.00" y1="80.00" x2="300.00" y2="248.00" stroke="#b31b1b" stroke-width="3.5" marker-end="url(#red-arrow)"/>
<text x="327" y="168" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">2</text>
<line x1="322.46" y1="264.02" x2="500.74" y2="176.86" stroke="#b31b1b" stroke-width="3.5" marker-end="url(#red-arrow)"/>
<text x="425" y="241" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">1</text>
<circle cx="75" cy="165" r="23" fill="white" stroke="#333" stroke-width="1.8"/><text x="75" y="166" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">1</text>
<circle cx="300" cy="55" r="23" fill="white" stroke="#333" stroke-width="1.8"/><text x="300" y="56" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">3</text>
<circle cx="300" cy="275" r="23" fill="white" stroke="#333" stroke-width="1.8"/><text x="300" y="276" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">2</text>
<circle cx="525" cy="165" r="23" fill="white" stroke="#333" stroke-width="1.8"/><text x="525" y="166" text-anchor="middle" dominant-baseline="middle" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#222">4</text>
</svg>
