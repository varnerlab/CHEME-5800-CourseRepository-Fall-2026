<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="379" viewBox="40 65 750 355" role="img" aria-labelledby="title description">
  <title id="title">Directed weighted graph used in the L4b traversal lab</title>
  <desc id="description">A six-vertex directed acyclic graph with seven weighted edges. Vertex 1 points to vertices 2 and 3; vertex 2 points to vertices 3 and 4; vertex 3 points to vertex 5; vertex 5 points to vertex 4; and vertex 4 points to vertex 6.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202020"/>
    </marker>
    <style>
      .edge { stroke: #202020; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .weight { font: 600 20px Arial, sans-serif; fill: #333; text-anchor: middle; paint-order: stroke fill; stroke: #fff; stroke-width: 10; stroke-linejoin: round; }
      .vertex { fill: #fff; stroke: #ef4136; stroke-width: 4; }
      .vertex-label { font: 600 24px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: central; }
    </style>
  </defs>

  <rect width="840" height="470" fill="#fff"/>
  <!-- Directed edges are drawn first so the vertex circles cover their endpoints. -->
  <line class="edge" x1="120" y1="229" x2="226" y2="141"/>
  <line class="edge" x1="120" y1="271" x2="226" y2="359"/>
  <line class="edge" x1="250" y1="152" x2="250" y2="348"/>
  <line class="edge" x1="282" y1="120" x2="488" y2="120"/>
  <line class="edge" x1="282" y1="380" x2="488" y2="380"/>
  <line class="edge" x1="520" y1="348" x2="520" y2="152"/>
  <line class="edge" x1="552" y1="120" x2="713" y2="120"/>

  <!-- Edge weights match data/SimpleGraph.txt. -->
  <text class="weight" x="146" y="179">10</text>
  <text class="weight" x="146" y="329">100</text>
  <text class="weight" x="290" y="256">2</text>
  <text class="weight" x="385" y="92">100</text>
  <text class="weight" x="385" y="352">6</text>
  <text class="weight" x="560" y="256">1</text>
  <text class="weight" x="633" y="92">1</text>

  <!-- Vertices -->
  <g>
    <circle class="vertex" cx="95" cy="250" r="31"/>
    <text class="vertex-label" x="95" y="250">1</text>

    <circle class="vertex" cx="250" cy="120" r="31"/>
    <text class="vertex-label" x="250" y="120">2</text>

    <circle class="vertex" cx="250" cy="380" r="31"/>
    <text class="vertex-label" x="250" y="380">3</text>

    <circle class="vertex" cx="520" cy="120" r="31"/>
    <text class="vertex-label" x="520" y="120">4</text>

    <circle class="vertex" cx="520" cy="380" r="31"/>
    <text class="vertex-label" x="520" y="380">5</text>

    <circle class="vertex" cx="745" cy="120" r="31"/>
    <text class="vertex-label" x="745" y="120">6</text>
  </g>
</svg>
