<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title description">
  <title id="title">Undirected and directed representations of the same weighted graph</title>
  <desc id="description">Two six-vertex, seven-edge graphs. The left graph is undirected and marks vertex 4 with degree 2. The right graph is directed and acyclic, marking vertex 2 with in-degree 2 and vertex 4 with out-degree 1.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#202020"/>
    </marker>
    <style>
      .panel-title { font: 600 34px Arial, sans-serif; fill: #111; text-anchor: middle; }
      .meta { font: 26px Arial, sans-serif; fill: #333; text-anchor: middle; }
      .edge { stroke: #202020; stroke-width: 3; fill: none; }
      .directed { marker-end: url(#arrow); }
      .weight { font: italic 22px Arial, sans-serif; fill: #333; text-anchor: middle; }
      .vertex { fill: #fff; stroke: #ef4136; stroke-width: 4; }
      .vertex-label { font: 600 24px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: central; }
      .measure { font: 25px Arial, sans-serif; fill: #222; text-anchor: middle; }
      .highlight-degree { fill: #dce8bf; stroke: none; }
      .highlight-in { fill: #bde4f0; stroke: none; }
      .highlight-out { fill: #ffd27a; stroke: none; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#fff"/>
  <text class="meta" x="700" y="48">Six vertices and seven edges: |V| = 6, |E| = 7</text>
  <text class="panel-title" x="350" y="118">Undirected graph</text>
  <text class="panel-title" x="1050" y="118">Directed acyclic graph</text>

  <!-- Undirected graph -->
  <rect class="highlight-degree" x="438" y="468" width="84" height="84" rx="12"/>
  <line class="edge" x1="100" y1="360" x2="230" y2="230"/>
  <line class="edge" x1="100" y1="360" x2="230" y2="500"/>
  <line class="edge" x1="230" y1="230" x2="230" y2="500"/>
  <line class="edge" x1="230" y1="230" x2="480" y2="230"/>
  <line class="edge" x1="230" y1="500" x2="480" y2="500"/>
  <line class="edge" x1="480" y1="230" x2="480" y2="500"/>
  <line class="edge" x1="480" y1="230" x2="620" y2="230"/>
  <text class="weight" x="155" y="280">w01</text>
  <text class="weight" x="154" y="455">w02</text>
  <text class="weight" x="260" y="370">w12</text>
  <text class="weight" x="350" y="214">w13</text>
  <text class="weight" x="350" y="486">w24</text>
  <text class="weight" x="510" y="370">w34</text>
  <text class="weight" x="550" y="214">w35</text>

  <!-- Directed graph -->
  <rect class="highlight-in" x="888" y="468" width="84" height="84" rx="12"/>
  <rect class="highlight-out" x="1138" y="468" width="84" height="84" rx="12"/>
  <line class="edge directed" x1="818" y1="342" x2="902" y2="258"/>
  <line class="edge directed" x1="819" y1="380" x2="901" y2="472"/>
  <line class="edge directed" x1="930" y1="260" x2="930" y2="468"/>
  <line class="edge directed" x1="960" y1="230" x2="1147" y2="230"/>
  <line class="edge directed" x1="960" y1="500" x2="1147" y2="500"/>
  <line class="edge directed" x1="1180" y1="468" x2="1180" y2="262"/>
  <line class="edge directed" x1="1210" y1="230" x2="1317" y2="230"/>
  <text class="weight" x="855" y="278">w01</text>
  <text class="weight" x="852" y="455">w02</text>
  <text class="weight" x="960" y="370">w12</text>
  <text class="weight" x="1050" y="214">w13</text>
  <text class="weight" x="1050" y="486">w24</text>
  <text class="weight" x="1210" y="370">w43</text>
  <text class="weight" x="1265" y="214">w35</text>

  <!-- Vertices -->
  <g>
    <circle class="vertex" cx="100" cy="360" r="30"/><text class="vertex-label" x="100" y="360">0</text>
    <circle class="vertex" cx="230" cy="230" r="30"/><text class="vertex-label" x="230" y="230">1</text>
    <circle class="vertex" cx="230" cy="500" r="30"/><text class="vertex-label" x="230" y="500">2</text>
    <circle class="vertex" cx="480" cy="230" r="30"/><text class="vertex-label" x="480" y="230">3</text>
    <circle class="vertex" cx="480" cy="500" r="30"/><text class="vertex-label" x="480" y="500">4</text>
    <circle class="vertex" cx="620" cy="230" r="30"/><text class="vertex-label" x="620" y="230">5</text>
    <circle class="vertex" cx="800" cy="360" r="30"/><text class="vertex-label" x="800" y="360">0</text>
    <circle class="vertex" cx="930" cy="230" r="30"/><text class="vertex-label" x="930" y="230">1</text>
    <circle class="vertex" cx="930" cy="500" r="30"/><text class="vertex-label" x="930" y="500">2</text>
    <circle class="vertex" cx="1180" cy="230" r="30"/><text class="vertex-label" x="1180" y="230">3</text>
    <circle class="vertex" cx="1180" cy="500" r="30"/><text class="vertex-label" x="1180" y="500">4</text>
    <circle class="vertex" cx="1350" cy="230" r="30"/><text class="vertex-label" x="1350" y="230">5</text>
  </g>

  <text class="measure" x="350" y="625">Degree of vertex 4: 2</text>
  <text class="measure" x="930" y="625">In-degree of vertex 2: 2</text>
  <text class="measure" x="1180" y="675">Out-degree of vertex 4: 1</text>
</svg>
