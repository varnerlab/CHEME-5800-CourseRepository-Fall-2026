<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title description">
  <title id="title">Rooted tree with height three</title>
  <desc id="description">The root r is at depth zero. Internal vertices are shown at depths one and two, and leaves occur at depths two and three. Each non-root vertex has one parent, and the largest vertex depth is three.</desc>
  <style>
    .title { font: 600 34px Arial, sans-serif; fill: #111; text-anchor: middle; }
    .subtitle { font: 24px Arial, sans-serif; fill: #555; text-anchor: middle; }
    .guide { stroke: #d7d7d7; stroke-width: 2; stroke-dasharray: 7 7; }
    .depth-label { font: 20px Arial, sans-serif; fill: #666; text-anchor: end; dominant-baseline: central; }
    .edge { stroke: #777; stroke-width: 4; fill: none; stroke-linecap: round; }
    .internal { fill: #fff; stroke: #ef4136; stroke-width: 4; }
    .root { fill: #ef4136; stroke: #ef4136; stroke-width: 4; }
    .leaf { fill: #e9e9e9; stroke: #777; stroke-width: 4; }
    .vertex-label { font: 600 23px Arial, sans-serif; fill: #111; text-anchor: middle; dominant-baseline: central; }
    .root-label { fill: #fff; }
    .panel-heading { font: 600 26px Arial, sans-serif; fill: #222; }
    .metric-heading { font: 600 23px Arial, sans-serif; fill: #222; }
    .metric-detail { font: 21px Arial, sans-serif; fill: #555; }
    .rule { stroke: #d7d7d7; stroke-width: 2; }
    .height-mark { stroke: #ef4136; stroke-width: 4; stroke-linecap: round; }
  </style>

  <rect width="1200" height="680" fill="#fff"/>
  <text class="title" x="600" y="48">Rooted tree</text>
  <text class="subtitle" x="600" y="80">Choosing a root gives every other vertex one parent</text>

  <!-- Depth guides sit behind the tree so the levels remain visible without crossing the vertices. -->
  <g>
    <text class="depth-label" x="86" y="160">depth 0</text>
    <text class="depth-label" x="86" y="295">depth 1</text>
    <text class="depth-label" x="86" y="430">depth 2</text>
    <text class="depth-label" x="86" y="565">depth 3</text>
    <line class="guide" x1="108" y1="160" x2="660" y2="160"/>
    <line class="guide" x1="108" y1="295" x2="660" y2="295"/>
    <line class="guide" x1="108" y1="430" x2="660" y2="430"/>
    <line class="guide" x1="108" y1="565" x2="660" y2="565"/>
  </g>

  <!-- The edges are undirected; the chosen root determines the parent-child relation. -->
  <g>
    <line class="edge" x1="365" y1="160" x2="220" y2="295"/>
    <line class="edge" x1="365" y1="160" x2="510" y2="295"/>
    <line class="edge" x1="220" y1="295" x2="125" y2="430"/>
    <line class="edge" x1="220" y1="295" x2="300" y2="430"/>
    <line class="edge" x1="510" y1="295" x2="445" y2="430"/>
    <line class="edge" x1="510" y1="295" x2="600" y2="430"/>
    <line class="edge" x1="300" y1="430" x2="250" y2="565"/>
    <line class="edge" x1="300" y1="430" x2="350" y2="565"/>
    <line class="edge" x1="445" y1="430" x2="470" y2="565"/>
  </g>

  <!-- Root, internal vertices, and leaves use distinct fills. -->
  <g>
    <circle class="root" cx="365" cy="160" r="30"/>
    <text class="vertex-label root-label" x="365" y="160">r</text>

    <circle class="internal" cx="220" cy="295" r="28"/>
    <text class="vertex-label" x="220" y="295">a</text>
    <circle class="internal" cx="510" cy="295" r="28"/>
    <text class="vertex-label" x="510" y="295">b</text>

    <circle class="leaf" cx="125" cy="430" r="28"/>
    <text class="vertex-label" x="125" y="430">c</text>
    <circle class="internal" cx="300" cy="430" r="28"/>
    <text class="vertex-label" x="300" y="430">d</text>
    <circle class="internal" cx="445" cy="430" r="28"/>
    <text class="vertex-label" x="445" y="430">e</text>
    <circle class="leaf" cx="600" cy="430" r="28"/>
    <text class="vertex-label" x="600" y="430">f</text>

    <circle class="leaf" cx="250" cy="565" r="28"/>
    <text class="vertex-label" x="250" y="565">g</text>
    <circle class="leaf" cx="350" cy="565" r="28"/>
    <text class="vertex-label" x="350" y="565">h</text>
    <circle class="leaf" cx="470" cy="565" r="28"/>
    <text class="vertex-label" x="470" y="565">i</text>
  </g>

  <g transform="translate(735 145)">
    <text class="panel-heading" x="0" y="0">What the picture shows</text>
    <line class="rule" x1="0" y1="24" x2="390" y2="24"/>

    <circle class="root" cx="18" cy="79" r="15"/>
    <text class="metric-heading" x="52" y="77">Root r</text>
    <text class="metric-detail" x="52" y="106">has no parent; depth is 0</text>

    <circle class="internal" cx="18" cy="176" r="15"/>
    <text class="metric-heading" x="52" y="174">Every other vertex</text>
    <text class="metric-detail" x="52" y="203">has exactly one parent</text>

    <circle class="leaf" cx="18" cy="273" r="15"/>
    <text class="metric-heading" x="52" y="271">Leaves c, f, g, h, i</text>
    <text class="metric-detail" x="52" y="300">have no children</text>

    <line class="height-mark" x1="5" y1="357" x2="31" y2="357"/>
    <line class="height-mark" x1="18" y1="357" x2="18" y2="412"/>
    <line class="height-mark" x1="5" y1="412" x2="31" y2="412"/>
    <text class="metric-heading" x="52" y="374">Height = 3</text>
    <text class="metric-detail" x="52" y="403">the largest vertex depth</text>
  </g>
</svg>
