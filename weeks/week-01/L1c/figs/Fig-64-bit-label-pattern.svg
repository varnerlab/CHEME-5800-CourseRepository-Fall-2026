<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="760"
    height="180"
    viewBox="0 0 760 180"
    role="img"
    aria-labelledby="title description">
  <title id="title">Float64 memory layout</title>
  <desc id="description">
    A Float64 has one sign bit at index 63, eleven exponent bits at indices 62
    through 52, and fifty-two fraction bits at indices 51 through 0.
  </desc>

  <rect width="760" height="180" fill="#ffffff"/>

  <g
      font-family="Arial, Helvetica, sans-serif"
      fill="#161616"
      shape-rendering="geometricPrecision">

    <!-- Field labels and guide rules -->
    <text
        x="17"
        y="69"
        font-size="17"
        text-anchor="middle"
        transform="rotate(-90 17 69)">sign (1 bit)</text>

    <text x="99.5" y="42" font-size="18" text-anchor="middle">
      exponent (11 bits)
    </text>
    <line x1="43" y1="58" x2="156" y2="58" stroke="#777777" stroke-width="1"/>

    <text x="446" y="42" font-size="18" text-anchor="middle">
      fraction (52 bits)
    </text>
    <line x1="164" y1="58" x2="728" y2="58" stroke="#777777" stroke-width="1"/>

    <!-- The three stored fields. Widths are proportional to their bit counts. -->
    <rect x="28" y="76" width="11" height="44" fill="#89CCE2"/>
    <rect x="39" y="76" width="121" height="44" fill="#C9D6A5"/>
    <rect x="160" y="76" width="572" height="44" fill="#EF4035"/>

    <rect
        x="28"
        y="76"
        width="704"
        height="44"
        fill="none"
        stroke="#333333"
        stroke-width="1.5"/>
    <line x1="39" y1="76" x2="39" y2="120" stroke="#333333" stroke-width="1.5"/>
    <line x1="160" y1="76" x2="160" y2="120" stroke="#333333" stroke-width="1.5"/>

    <!-- Bit indices at the field boundaries -->
    <g font-size="16" text-anchor="middle">
      <line x1="33.5" y1="122" x2="25" y2="136" stroke="#333333"/>
      <text x="25" y="157">63</text>

      <line x1="44.5" y1="122" x2="58" y2="136" stroke="#333333"/>
      <text x="58" y="157">62</text>

      <line x1="154.5" y1="122" x2="138" y2="136" stroke="#333333"/>
      <text x="138" y="157">52</text>

      <line x1="165.5" y1="122" x2="182" y2="136" stroke="#333333"/>
      <text x="182" y="157">51</text>

      <line x1="726.5" y1="122" x2="726.5" y2="136" stroke="#333333"/>
      <text x="726.5" y="157">0</text>
    </g>
  </g>
</svg>
