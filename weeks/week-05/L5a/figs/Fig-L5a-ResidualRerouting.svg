<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="325" viewBox="0 0 1140 325" role="img" aria-labelledby="title desc">
<title id="title">A reverse edge allows an earlier flow to be rerouted</title>
<desc id="desc">All five original edges have capacity one. First, flow follows s to a to b to t. Next, the residual augmentation follows s to b to a to t and cancels the original a to b flow. Finally, two units reach t along s to a to t and s to b to t.</desc>
<style>
  .canvas { fill: none; }
  @media screen and (prefers-color-scheme: dark) {
    [fill="#202020"] { fill: #e6e9ed; }
    [fill="#52525b"] { fill: #c0c7d0; }
    [fill="#334155"] { fill: #cbd5e1; }
    [stroke="#334155"] { stroke: #cbd5e1; }
    [fill="#a1a1aa"] { fill: #9ca3af; }
    [stroke="#a1a1aa"] { stroke: #9ca3af; }
    [fill="#007f86"] { fill: #5ed5d5; }
    [stroke="#007f86"] { stroke: #5ed5d5; }
    circle { fill: #232830; }
  }
  @media print { .canvas { fill: white; } }
</style>
<defs>
  <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#a1a1aa"/></marker>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007f86"/></marker>
</defs>
<rect class="canvas" width="1140" height="325" fill="white"/>
<g font-family="Arial, sans-serif" font-size="16" fill="#202020">

<g transform="translate(14,0)">
<text x="177" y="23" text-anchor="middle" font-size="18" font-weight="bold">1. First flow: value = 1</text>
<text x="177" y="46" text-anchor="middle" font-size="14" fill="#52525b">Labels: flow / capacity</text>
<line x1="48.73" y1="153.00" x2="157.63" y2="94.42" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="95" y="107" text-anchor="middle" fill="#334155">1/1</text>
<line x1="48.73" y1="171.00" x2="157.63" y2="229.58" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<text x="95" y="226" text-anchor="middle" fill="#a1a1aa">0/1</text>
<line x1="177.00" y1="103.00" x2="177.00" y2="218.00" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="199" y="168" text-anchor="middle" fill="#334155">1/1</text>
<line x1="193.73" y1="93.00" x2="302.63" y2="151.58" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<text x="259" y="107" text-anchor="middle" fill="#a1a1aa">0/1</text>
<line x1="193.73" y1="231.00" x2="302.63" y2="172.42" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="259" y="226" text-anchor="middle" fill="#334155">1/1</text>
<circle cx="32" cy="162" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="32" y="168" text-anchor="middle" font-style="italic" font-size="19">s</text>
<circle cx="177" cy="84" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="177" y="90" text-anchor="middle" font-style="italic" font-size="19">a</text>
<circle cx="177" cy="240" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="177" y="246" text-anchor="middle" font-style="italic" font-size="19">b</text>
<circle cx="322" cy="162" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="322" y="168" text-anchor="middle" font-style="italic" font-size="19">t</text>
<text x="177" y="294" text-anchor="middle" font-size="15">Route: s → a → b → t</text>
</g>
<g transform="translate(394,0)">
<text x="177" y="23" text-anchor="middle" font-size="18" font-weight="bold">2. Residual augmentation: Δ = 1</text>
<text x="177" y="46" text-anchor="middle" font-size="14" fill="#52525b">Labels: residual capacity</text>
<line x1="160.27" y1="93.00" x2="51.37" y2="151.58" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<text x="95" y="107" text-anchor="middle" fill="#a1a1aa">1</text>
<line x1="48.73" y1="171.00" x2="157.63" y2="229.58" stroke="#007f86" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="95" y="226" text-anchor="middle" fill="#007f86">1</text>
<line x1="177.00" y1="221.00" x2="177.00" y2="106.00" stroke="#007f86" stroke-width="3" marker-end="url(#arrow-teal)" stroke-dasharray="6 4"/>
<text x="199" y="168" text-anchor="middle" fill="#007f86">1</text>
<line x1="193.73" y1="93.00" x2="302.63" y2="151.58" stroke="#007f86" stroke-width="3" marker-end="url(#arrow-teal)"/>
<text x="259" y="107" text-anchor="middle" fill="#007f86">1</text>
<line x1="305.27" y1="171.00" x2="196.37" y2="229.58" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<text x="259" y="226" text-anchor="middle" fill="#a1a1aa">1</text>
<circle cx="32" cy="162" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="32" y="168" text-anchor="middle" font-style="italic" font-size="19">s</text>
<circle cx="177" cy="84" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="177" y="90" text-anchor="middle" font-style="italic" font-size="19">a</text>
<circle cx="177" cy="240" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="177" y="246" text-anchor="middle" font-style="italic" font-size="19">b</text>
<circle cx="322" cy="162" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="322" y="168" text-anchor="middle" font-style="italic" font-size="19">t</text>
<text x="177" y="294" text-anchor="middle" font-size="15">Route: s → b → a → t</text>
<text x="177" y="315" text-anchor="middle" font-size="13" fill="#007f86">Dashed edge cancels the earlier a → b flow.</text>
</g>
<g transform="translate(774,0)">
<text x="177" y="23" text-anchor="middle" font-size="18" font-weight="bold">3. Revised flow: value = 2</text>
<text x="177" y="46" text-anchor="middle" font-size="14" fill="#52525b">Labels: flow / capacity</text>
<line x1="48.73" y1="153.00" x2="157.63" y2="94.42" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="95" y="107" text-anchor="middle" fill="#334155">1/1</text>
<line x1="48.73" y1="171.00" x2="157.63" y2="229.58" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="95" y="226" text-anchor="middle" fill="#334155">1/1</text>
<line x1="177.00" y1="103.00" x2="177.00" y2="218.00" stroke="#a1a1aa" stroke-width="1.6" marker-end="url(#arrow-gray)"/>
<text x="199" y="168" text-anchor="middle" fill="#a1a1aa">0/1</text>
<line x1="193.73" y1="93.00" x2="302.63" y2="151.58" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="259" y="107" text-anchor="middle" fill="#334155">1/1</text>
<line x1="193.73" y1="231.00" x2="302.63" y2="172.42" stroke="#334155" stroke-width="3" marker-end="url(#arrow-dark)"/>
<text x="259" y="226" text-anchor="middle" fill="#334155">1/1</text>
<circle cx="32" cy="162" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="32" y="168" text-anchor="middle" font-style="italic" font-size="19">s</text>
<circle cx="177" cy="84" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="177" y="90" text-anchor="middle" font-style="italic" font-size="19">a</text>
<circle cx="177" cy="240" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="177" y="246" text-anchor="middle" font-style="italic" font-size="19">b</text>
<circle cx="322" cy="162" r="18" fill="white" stroke="#334155" stroke-width="1.5"/>
<text x="322" y="168" text-anchor="middle" font-style="italic" font-size="19">t</text>
<text x="177" y="294" text-anchor="middle" font-size="15">Routes: s → a → t and s → b → t</text>
</g>
</g></svg>
