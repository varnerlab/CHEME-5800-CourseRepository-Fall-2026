<svg xmlns="http://www.w3.org/2000/svg" width="740" height="408" viewBox="0 0 740 408" role="img" aria-labelledby="title desc">
  <title id="title">Grid world for one Bellman backup</title>
  <desc id="desc">Coordinates increase rightward and upward. The center at (2,2) is a wall. The goal at (3,3) earns ten on entry and zero thereafter. The corner at (3,1) has the available actions up and left.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #202b36; }
    .cell { fill: #f7f9fb; stroke: #617181; stroke-width: 1.5; }
    .goal { fill: #e1f2e6; }
    .wall { fill: #dbe1e7; }
    .start { fill: #e3efff; }
    .arrow { fill: none; stroke: #2265b2; stroke-width: 4; marker-end: url(#action-head); }
    .action-head { fill: #2265b2; }
    .axis { stroke: #617181; stroke-width: 1.5; marker-end: url(#axis-head); }
    .axis-head { fill: #617181; }
    .muted { fill: #4c5f70; }
    .action-label { fill: #18579f; font-weight: bold; }
    @media screen and (prefers-color-scheme: dark) {
      text { fill: #edf2f7; }
      .cell { fill: #263441; stroke: #a8b7c5; }
      .goal { fill: #204b38; }
      .wall { fill: #4a5562; }
      .start { fill: #193e65; }
      .arrow { stroke: #79baff; }
      .action-head { fill: #79baff; }
      .axis { stroke: #a8b7c5; }
      .axis-head { fill: #a8b7c5; }
      .muted { fill: #bacbd9; }
      .action-label { fill: #95c9ff; }
    }
  </style>
  <defs>
    <marker id="action-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="action-head" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
    <marker id="axis-head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="axis-head" d="M 0 0 L 10 5 L 0 10 Z"/>
    </marker>
  </defs>
  <g>
    <rect class="cell" x="62" y="28" width="100" height="100"/>
    <rect class="cell" x="162" y="28" width="100" height="100"/>
    <rect class="cell goal" x="262" y="28" width="100" height="100"/>
    <rect class="cell" x="62" y="128" width="100" height="100"/>
    <rect class="cell wall" x="162" y="128" width="100" height="100"/>
    <rect class="cell" x="262" y="128" width="100" height="100"/>
    <rect class="cell" x="62" y="228" width="100" height="100"/>
    <rect class="cell" x="162" y="228" width="100" height="100"/>
    <rect class="cell start" x="262" y="228" width="100" height="100"/>
  </g>
  <g font-size="16" text-anchor="middle">
    <text x="112" y="82">(1,3)</text>
    <text x="212" y="82">(2,3)</text>
    <text x="312" y="58" font-weight="bold">Goal</text>
    <text x="312" y="82">(3,3)</text>
    <text x="312" y="108" font-size="14">+10 on entry</text>
    <text x="112" y="182">(1,2)</text>
    <text x="212" y="171" font-weight="bold">Wall</text>
    <text x="212" y="196">(2,2)</text>
    <text x="312" y="160">(3,2)</text>
    <text x="112" y="282">(1,1)</text>
    <text x="193" y="306">(2,1)</text>
    <text x="312" y="306" font-weight="bold">(3,1)</text>
  </g>
  <path class="arrow" d="M 312 272 L 312 194"/>
  <path class="arrow" d="M 302 278 L 216 278"/>
  <text class="action-label" x="326" y="221" font-size="15">up</text>
  <text class="action-label" x="227" y="262" font-size="15">left</text>
  <path class="axis" d="M 62 355 L 362 355"/>
  <path class="axis" d="M 35 328 L 35 28"/>
  <text class="muted" x="376" y="361" font-size="17">x</text>
  <text class="muted" x="29" y="20" font-size="17">y</text>
  <g font-size="17">
    <text x="410" y="69" font-size="21" font-weight="bold">Update the corner (3,1)</text>
    <text x="410" y="106">Two available actions: up and left</text>
    <text x="410" y="154" font-weight="bold">Each action has three outcomes</text>
    <text x="410" y="184">0.8: move in the intended direction</text>
    <text x="410" y="213">0.1: slip in each perpendicular direction</text>
    <text x="410" y="260" font-weight="bold">Rewards</text>
    <text x="410" y="290">Goal entry: +10; no further reward</text>
    <text x="410" y="319">Wall bump: −5; remain in place</text>
    <text x="410" y="348">Other outcomes: −1</text>
    <text class="muted" x="410" y="377" font-size="15">A slip off the grid also leaves the robot in place.</text>
  </g>
</svg>
