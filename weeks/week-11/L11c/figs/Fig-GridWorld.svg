<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
  <title id="t">The slippery three by three grid world</title>
  <desc id="d">Two panels. The left panel is a three by three grid, x increasing rightward and y upward. The goal sits at (3,3) and earns plus ten on entry. An obstacle sits at (2,2) and earns minus five when bumped. Every other transition earns minus one. The right panel shows the slip model for a single intended move: the robot goes in the intended direction with probability zero point eight, and slips to each perpendicular direction with probability zero point one. A move off the grid, or a bump into the obstacle, leaves the robot where it is.</desc>
  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; }
    text { fill: #1f2937; font-variant-numeric: tabular-nums; }
    .eyebrow { fill: #8b97a6; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .sub     { fill: #8b97a6; font-size: 12.5px; }
    .coord   { fill: #9aa5b1; font-size: 12px; letter-spacing: .4px; }
    .tag     { fill: #6b7785; font-size: 10.5px; font-weight: 700; letter-spacing: .9px; }
    .rew     { font-size: 13px; }
    .note    { fill: #76828f; font-size: 12px; }
    .sq      { fill: #fbfcfd; stroke: #dde3ea; stroke-width: 1; }
    .sq-goal { fill: #eaf6ee; stroke: #bfe0ca; }
    .sq-obs  { fill: #eef1f4; stroke: #dde3ea; }
    .sq-bot  { fill: #ffffff; stroke: #2f6fb5; stroke-width: 2; }
    .axis    { stroke: #c3ccd6; stroke-width: 1.25; stroke-linecap: round; }
    .arr     { fill: none; stroke: #2f6fb5; stroke-linecap: round; marker-end: url(#a); }
    .arr-m   { stroke-width: 7; opacity: .9; }
    .arr-s   { stroke-width: 1.75; opacity: .45; }
    .pmaj    { fill: #2f6fb5; font-size: 14px; font-weight: 700; }
    .pmin    { fill: #93a0ad; font-size: 14px; }
    .bot     { fill: #2f6fb5; }
    @media screen and (prefers-color-scheme: dark) {
      text { fill: #e8edf3; }
      .eyebrow, .sub, .coord { fill: #7f8d9d; }
      .tag { fill: #9fadbc; } .note { fill: #96a4b3; }
      .sq { fill: #1d2731; stroke: #33414f; }
      .sq-goal { fill: #1b3a2c; stroke: #2f5f47; }
      .sq-obs { fill: #2b3643; stroke: #3a4857; }
      .sq-bot { fill: #16202a; stroke: #6fa8e6; }
      .axis { stroke: #46535f; }
      .arr { stroke: #6fa8e6; } .pmaj { fill: #8fc0f2; } .pmin { fill: #68788a; }
      .bot { fill: #6fa8e6; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0.6 L 8 4 L 0 7.4 Z" fill="#2f6fb5"/>
    </marker>
  </defs>
  <g class="f">
    <text class="eyebrow" x="48" y="48">THE GRID WORLD</text>
    <text class="sub" x="48" y="69">Eight traversable squares; the goal is terminal.</text>

    <g transform="translate(0,22)">
      <rect class="sq" x="48" y="92" width="86" height="86" rx="5"/>
      <rect class="sq" x="134" y="92" width="86" height="86" rx="5"/>
      <rect class="sq sq-goal" x="220" y="92" width="86" height="86" rx="5"/>
      <rect class="sq" x="48" y="178" width="86" height="86" rx="5"/>
      <rect class="sq sq-obs" x="134" y="178" width="86" height="86" rx="5"/>
      <rect class="sq" x="220" y="178" width="86" height="86" rx="5"/>
      <rect class="sq" x="48" y="264" width="86" height="86" rx="5"/>
      <rect class="sq" x="134" y="264" width="86" height="86" rx="5"/>
      <rect class="sq" x="220" y="264" width="86" height="86" rx="5"/>

      <g text-anchor="middle">
        <text class="coord" x="91"  y="141">(1,3)</text>
        <text class="coord" x="177" y="141">(2,3)</text>
        <text class="tag"   x="263" y="124">GOAL</text>
        <text class="coord" x="263" y="144">(3,3)</text>
        <text class="rew"   x="263" y="164">+10</text>

        <text class="coord" x="91"  y="227">(1,2)</text>
        <text class="tag"   x="177" y="212">OBSTACLE</text>
        <text class="coord" x="177" y="232">(2,2)</text>
        <text class="rew"   x="177" y="252">&#8722;5</text>
        <text class="coord" x="263" y="227">(3,2)</text>

        <text class="coord" x="91"  y="313">(1,1)</text>
        <text class="coord" x="177" y="313">(2,1)</text>
        <text class="coord" x="263" y="313">(3,1)</text>
      </g>

      <path class="axis" d="M 48 368 L 306 368"/>
      <path class="axis" d="M 34 352 L 34 92"/>
      <text class="coord" x="312" y="372">x</text>
      <text class="coord" x="29" y="84">y</text>
    </g>

    <text class="note" x="48" y="420">Every other transition earns &#8722;1.</text>

    <text class="eyebrow" x="470" y="48">ONE INTENDED MOVE</text>
    <text class="sub" x="470" y="69">The terrain is slippery, so an action is stochastic.</text>

    <g transform="translate(0,-54)">
    <rect class="sq sq-bot" x="628" y="268" width="86" height="86" rx="5"/>
    <text class="coord" x="671" y="316" text-anchor="middle">robot</text>

    <path class="arr arr-m" d="M 671 262 L 671 168"/>
    <text class="pmaj" x="686" y="206">0.8  intended</text>

    <path class="arr arr-s" d="M 622 311 L 530 311"/>
    <text class="pmin" x="470" y="300">0.1  slip</text>

    <path class="arr arr-s" d="M 720 311 L 812 311"/>
    <text class="pmin" x="760" y="300">0.1  slip</text>

    </g>
    <text class="note" x="470" y="392">A move off the grid, or a bump into the obstacle,</text>
    <text class="note" x="470" y="412">leaves the robot where it is.</text>
  </g>
</svg>
