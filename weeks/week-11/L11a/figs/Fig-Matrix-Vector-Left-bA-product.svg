<?xml version="1.0" encoding="UTF-8"?>
<svg width="790px" height="244px" viewBox="0 0 790 244" version="1.1" xmlns="http://www.w3.org/2000/svg">
<style id="course-theme">
  @media screen and (prefers-color-scheme: dark) {
    [fill="#000000"] { fill: #e3e6ea; }
    [stroke="#000000"] { stroke: #e3e6ea; }
    [fill="#FFFFFF"] { fill: none; }
  }
  @media print { svg { background: white; } }
</style>
    <title>Left vector-matrix product: a row vector times a matrix is a weighted sum of the matrix rows</title>
    <g id="row-vector" stroke="#000000" stroke-width="1.5">
        <rect x="40" y="100" width="44" height="44" fill="#FFFFFF"/>
        <rect x="84" y="100" width="44" height="44" fill="#FFFFFF"/>
        <rect x="128" y="100" width="44" height="44" fill="#FFFFFF"/>
    </g>
    <g id="matrix" stroke="#000000" stroke-width="1.5">
        <rect x="216" y="56" width="44" height="44" fill="#D46A6A"/>
        <rect x="260" y="56" width="44" height="44" fill="#D46A6A"/>
        <rect x="304" y="56" width="44" height="44" fill="#D46A6A"/>
        <rect x="216" y="100" width="44" height="44" fill="#9DC183"/>
        <rect x="260" y="100" width="44" height="44" fill="#9DC183"/>
        <rect x="304" y="100" width="44" height="44" fill="#9DC183"/>
        <rect x="216" y="144" width="44" height="44" fill="#7BA7D9"/>
        <rect x="260" y="144" width="44" height="44" fill="#7BA7D9"/>
        <rect x="304" y="144" width="44" height="44" fill="#7BA7D9"/>
    </g>
    <g id="weighted-rows" stroke="#000000" stroke-width="1.5">
        <rect x="396" y="12" width="44" height="44" fill="#FFFFFF"/>
        <rect x="440" y="12" width="44" height="44" fill="#D46A6A"/>
        <rect x="484" y="12" width="44" height="44" fill="#D46A6A"/>
        <rect x="528" y="12" width="44" height="44" fill="#D46A6A"/>
        <rect x="396" y="100" width="44" height="44" fill="#FFFFFF"/>
        <rect x="440" y="100" width="44" height="44" fill="#9DC183"/>
        <rect x="484" y="100" width="44" height="44" fill="#9DC183"/>
        <rect x="528" y="100" width="44" height="44" fill="#9DC183"/>
        <rect x="396" y="188" width="44" height="44" fill="#FFFFFF"/>
        <rect x="440" y="188" width="44" height="44" fill="#7BA7D9"/>
        <rect x="484" y="188" width="44" height="44" fill="#7BA7D9"/>
        <rect x="528" y="188" width="44" height="44" fill="#7BA7D9"/>
    </g>
    <g id="result" stroke="#000000" stroke-width="1.5">
        <rect x="616" y="100" width="44" height="44" fill="#E8D1DC"/>
        <rect x="660" y="100" width="44" height="44" fill="#E8D1DC"/>
        <rect x="704" y="100" width="44" height="44" fill="#E8D1DC"/>
    </g>
    <g id="labels" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#000000" text-anchor="middle">
        <text x="62" y="131">a</text>
        <text x="106" y="131">b</text>
        <text x="150" y="131">c</text>
        <text x="194" y="131">×</text>
        <text x="372" y="131">=</text>
        <text x="418" y="43">a</text>
        <text x="418" y="131">b</text>
        <text x="418" y="219">c</text>
        <text x="484" y="87">+</text>
        <text x="484" y="175">+</text>
        <text x="594" y="131">=</text>
    </g>
</svg>
