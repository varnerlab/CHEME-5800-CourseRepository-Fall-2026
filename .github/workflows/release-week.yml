name: Release weekly student bundle

# Pushing a tag week-NN.P builds the student bundle and opens a DRAFT release.
# From week 06 onward (manifests with `cadence = "meeting"`) the patch number P
# names the last class meeting included: week-NN.0 is the first meeting only,
# week-NN.1 the first two, and so on. A patch at or beyond the last meeting is a
# fix-only release of the complete week. Every release is cumulative.

on:
  push:
    tags:
      - 'week-[0-9][0-9].[0-9]*'

permissions:
  contents: write

jobs:
  build-and-draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - uses: julia-actions/cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Read release identity
        id: release
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^week-([0-9]{2})\.([0-9]+)$ ]]; then
            echo "Invalid weekly release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          week="${BASH_REMATCH[1]}"
          week_number="$((10#${week}))"
          printf 'week=%s\n' "${week}" >> "${GITHUB_OUTPUT}"

      - name: Determine release scope
        id: scope
        shell: bash
        run: |
          python3 scripts/build_week.py "${{ steps.release.outputs.week }}" \
            --expected-tag "${GITHUB_REF_NAME}" --scope-only | tee -a "${GITHUB_OUTPUT}"

      - name: Instantiate course environment
        run: julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Check bundle inclusion rules
        run: python3 -m unittest discover -s instructor/validation -p 'test_week_bundles.py'

      - name: Validate week
        env:
          RELEASE_MEETINGS: ${{ steps.scope.outputs.included }}
        run: julia --startup-file=no --project=. "instructor/validation/week-${{ steps.release.outputs.week }}/runtests.jl"

      - name: Check notebook style
        shell: bash
        run: |
          notebooks=()
          for meeting in ${{ steps.scope.outputs.included }}; do
            while IFS= read -r -d '' notebook; do notebooks+=("${notebook}"); done \
              < <(find "weeks/week-${{ steps.release.outputs.week }}/${meeting}" -name '*.ipynb' -print0)
          done
          test "${#notebooks[@]}" -gt 0
          python3 instructor/validation/notebook_style_check.py "${notebooks[@]}" --strict

      - name: Build student bundle
        run: ./scripts/build-week.sh "${{ steps.release.outputs.week }}" --expected-tag "${GITHUB_REF_NAME}"

      - name: Test extracted bundle
        shell: bash
        run: |
          archive="$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "${archive}"
          release_test="$(mktemp -d)"
          python3 -m zipfile -e "${archive}" "${release_test}"
          bundle="$(find "${release_test}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          cd "${bundle}"
          julia --startup-file=no --project=. -e 'using Pkg; Pkg.instantiate()'
          julia --startup-file=no --project=. -e 'using VLDataScienceMachineLearningPackage; println("SETUP-OK")'
          while IFS= read -r include_file; do
            julia --startup-file=no --project=. -e 'include(ARGS[1])' "${include_file}"
          done < <(find "weeks/week-${{ steps.release.outputs.week }}" -name Include.jl | sort)

      - name: Create draft GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$(find dist -maxdepth 1 -name '*.zip' -print -quit)"
          checksum="${archive}.sha256"
          notes="dist/RELEASE-NOTES-${GITHUB_REF_NAME}.md"
          gh release create "${GITHUB_REF_NAME}" "${archive}" "${checksum}" \
            --draft \
            --verify-tag \
            --title "${{ steps.scope.outputs.title }}" \
            --notes-file "${notes}"
